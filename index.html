
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE GARUDA NEWS - Poster Maker</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #eef1f5;
    color: #182235;
}

header {
    background: #101d35;
    color: white;
    padding: 17px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand img {
    width: 43px;
    height: 43px;
    object-fit: contain;
    background: white;
    border-radius: 5px;
}

.brand h1 {
    font-size: 19px;
    letter-spacing: 1px;
}

.brand p {
    color: #c5cedb;
    font-size: 10px;
    margin-top: 4px;
    letter-spacing: 1.5px;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 20px;
}

.layout {
    display: grid;
    grid-template-columns: 370px minmax(0, 1fr);
    gap: 25px;
    align-items: start;
}

.editor {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px #14213a12;
}

.editor h2 {
    font-size: 20px;
    margin-bottom: 18px;
}

.group {
    margin-bottom: 17px;
}

.group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
    color: #344158;
}

input[type="text"],
textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #d7dce5;
    border-radius: 7px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
}

textarea {
    min-height: 130px;
    resize: vertical;
    line-height: 1.6;
}

input:focus,
textarea:focus {
    border-color: #d92732;
}

input[type="file"] {
    width: 100%;
    font-size: 12px;
}

input[type="range"] {
    width: 100%;
    accent-color: #d92732;
}

.range-value {
    font-size: 12px;
    color: #d92732;
    font-weight: bold;
    margin-top: 4px;
}

.hint {
    color: #7d8797;
    font-size: 11px;
    margin-top: 5px;
}

.button {
    border: none;
    padding: 12px 15px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
}

.primary {
    background: #d92732;
    color: white;
}

.secondary {
    background: #e9edf4;
    color: #24334b;
}

.button-row {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.button-row button {
    flex: 1;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.actions button {
    flex: 1;
    padding: 14px 8px;
}

.preview-area {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.preview-title {
    width: 100%;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 12px;
}

.poster-frame {
    width: min(100%, 450px);
    aspect-ratio: 9 / 16;
    background: white;
    overflow: hidden;
    box-shadow: 0 8px 35px #14213a30;
    border-radius: 4px;
}

#posterCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

@media(max-width:850px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .editor {
        order: 2;
    }

    .preview-area {
        order: 1;
    }

    .poster-frame {
        width: min(100%, 420px);
    }
}

@media(max-width:480px) {
    main {
        padding: 12px;
    }

    header {
        padding: 13px;
    }

    .brand h1 {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="garuda-logo.png" alt="Garuda Logo">
        <div>
            <h1>THE GARUDA NEWS</h1>
            <p>YOUR NEWS. YOUR VOICE.</p>
        </div>
    </div>
    <div style="font-size:11px;color:#d9e1ee">
        POSTER MAKER
    </div>
</header>

<main>
<div class="layout">

<section class="editor">

    <h2>Poster Editor</h2>

    <div class="group">
        <label>Upload News Photo</label>
        <input type="file" id="photoInput" accept="image/*">
    </div>

    <div class="group">
        <label>Photo Zoom</label>
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
        <div class="range-value" id="zoomValue">1.00x</div>
    </div>

    <div class="group">
        <label>Move Photo Left / Right</label>
        <input type="range" id="cropX" min="-100" max="100" value="0">
    </div>

    <div class="group">
        <label>Move Photo Up / Down</label>
        <input type="range" id="cropY" min="-100" max="100" value="0">
    </div>

    <button class="button secondary" id="resetCrop" style="width:100%">
        Reset Crop
    </button>

    <hr style="border:0;border-top:1px solid #e6e9ef;margin:19px 0">

    <div class="group">
        <label>Upload Garuda Logo (Optional)</label>
        <input type="file" id="logoInput" accept="image/*">
        <p class="hint">Logo appears inside a red-bordered square on the photo.</p>
    </div>

    <div class="group">
        <label>News Headline</label>
        <textarea id="headline" rows="3" placeholder="Enter Telugu news headline">ఓటు హక్కును వినియోగించుకున్న అర్రిబోయిన రాంబాబు గారు</textarea>
    </div>

    <div class="group">
        <label>News Description</label>
        <textarea id="description" placeholder="Enter news description">ప్రజాస్వామ్య పండుగలో భాగంగా డా. అర్రిబోయిన రాంబాబు గారు తమ అమూల్యమైన ఓటు హక్కును వినియోగించుకున్నారు. ప్రతి పౌరుడికి ఓటు హక్కు ఎంతో విలువైనది. దేశ భవిష్యత్తును, ప్రజాస్వామ్య వ్యవస్థను బలోపేతం చేయడంలో ప్రతి ఓటు కీలక పాత్ర పోషిస్తుంది. బాధ్యతాయుతమైన పౌరుడిగా తన ఓటు హక్కును వినియోగించుకుని ప్రజాస్వామ్య స్ఫూర్తిని చాటారు.</textarea>
        <p class="hint" id="wordCount">0 / 100 words</p>
    </div>

    <div class="group">
        <label>Date and Edition</label>
        <input type="text" id="dateText" value="05 NOVEMBER 2026 | ANDHRA PRADESH">
    </div>

    <div class="button-row">
        <button class="button secondary" id="resetAll">Reset Text</button>
        <button class="button secondary" id="refresh">Refresh Preview</button>
    </div>

    <div class="actions">
        <button class="button primary" id="downloadBtn">Download PNG</button>
        <button class="button secondary" id="shareBtn">Share Poster</button>
    </div>

    <p class="hint" style="margin-top:12px">
        Final image resolution: 1080 × 1920 pixels.
    </p>

</section>

<section class="preview-area">
    <div class="preview-title">Live Poster Preview</div>
    <div class="poster-frame">
        <canvas id="posterCanvas" width="1080" height="1920"></canvas>
    </div>
</section>

</div>
</main>

<script>
const canvas = document.getElementById("posterCanvas");
const ctx = canvas.getContext("2d");

const W = 1080;
const H = 1920;

const PHOTO_HEIGHT = 768;
const CONTENT_START = 768;

let photo = null;
let logo = null;

let cropZoom = 1;
let cropX = 0;
let cropY = 0;

const $ = id => document.getElementById(id);

function loadImage(file, callback) {
    const reader = new FileReader();

    reader.onload = () => {
        const image = new Image();

        image.onload = () => callback(image);
        image.src = reader.result;
    };

    reader.readAsDataURL(file);
}

$("photoInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    loadImage(file, img => {
        photo = img;
        renderPoster();
    });
});

$("logoInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    loadImage(file, img => {
        logo = img;
        renderPoster();
    });
});

$("zoom").addEventListener("input", e => {
    cropZoom = Number(e.target.value);
    $("zoomValue").textContent = cropZoom.toFixed(2) + "x";
    renderPoster();
});

$("cropX").addEventListener("input", e => {
    cropX = Number(e.target.value);
    renderPoster();
});

$("cropY").addEventListener("input", e => {
    cropY = Number(e.target.value);
    renderPoster();
});

$("resetCrop").addEventListener("click", () => {
    cropZoom = 1;
    cropX = 0;
    cropY = 0;

    $("zoom").value = 1;
    $("cropX").value = 0;
    $("cropY").value = 0;
    $("zoomValue").textContent = "1.00x";

    renderPoster();
});

function getWords(text) {
    return text.trim().split(/\s+/).filter(Boolean);
}

function wrapText(text, maxWidth, font) {
    ctx.font = font;

    const words = getWords(text);
    const lines = [];
    let line = "";

    for (const word of words) {
        const test = line ? line + " " + word : word;

        if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = word;
        } else {
            line = test;
        }
    }

    if (line) lines.push(line);

    return lines;
}

function drawCoverImage(img) {
    const scale = Math.max(
        W / img.width,
        PHOTO_HEIGHT / img.height
    ) * cropZoom;

    const drawW = img.width * scale;
    const drawH = img.height * scale;

    const overflowX = Math.max(0, drawW - W);
    const overflowY = Math.max(0, drawH - PHOTO_HEIGHT);

    const dx = (W - drawW) / 2 - (cropX / 100) * overflowX / 2;
    const dy = (PHOTO_HEIGHT - drawH) / 2 - (cropY / 100) * overflowY / 2;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, PHOTO_HEIGHT);
    ctx.clip();

    ctx.drawImage(img, dx, dy, drawW, drawH);

    ctx.restore();
}

function drawBrandBanner() {
    ctx.save();

    ctx.fillStyle = "#d71927";
    ctx.beginPath();
    ctx.moveTo(0, 45);
    ctx.lineTo(205, 45);
    ctx.lineTo(185, 88);
    ctx.lineTo(0, 88);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#10213f";
    ctx.beginPath();
    ctx.moveTo(205, 45);
    ctx.lineTo(355, 45);
    ctx.lineTo(335, 88);
    ctx.lineTo(185, 88);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 27px Arial";
    ctx.textBaseline = "middle";
    ctx.fillText("GARUDA", 18, 67);

    ctx.font = "bold 25px Arial";
    ctx.fillText("NEWS", 235, 67);

    ctx.restore();
}


function drawLogo() {
    if (!logo) return;

    const size = 112;
    const x = W - size - 30;
    const y = PHOTO_HEIGHT - size - 25;

    ctx.save();

    // White background with rounded corners
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.roundRect(x, y, size, size, 12);
    ctx.fill();

    // Black rounded border
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.roundRect(x + 2, y + 2, size - 4, size - 4, 12);
    ctx.stroke();

    // Fit logo inside the frame
    const padding = 9;
    const maxW = size - padding * 2;
    const maxH = size - padding * 2;

    const scale = Math.min(
        maxW / logo.width,
        maxH / logo.height
    );

    const dw = logo.width * scale;
    const dh = logo.height * scale;

    ctx.drawImage(
        logo,
        x + (size - dw) / 2,
        y + (size - dh) / 2,
        dw,
        dh
    );

    ctx.restore();
}


function drawPhotoSection() {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, PHOTO_HEIGHT);

    if (photo) {
        drawCoverImage(photo);
    } else {
        ctx.fillStyle = "#e8edf3";
        ctx.fillRect(0, 0, W, PHOTO_HEIGHT);

        ctx.fillStyle = "#667085";
        ctx.textAlign = "center";
        ctx.font = "bold 38px Arial";
        ctx.fillText("UPLOAD NEWS PHOTO", W / 2, PHOTO_HEIGHT / 2);
        ctx.textAlign = "left";
    }

    drawBrandBanner();
    drawLogo();
}

function drawHeadline() {
    const text = $("headline").value.trim();

    const left = 65;
    const maxWidth = 950;

    let fontSize = 46;
    const minFontSize = 36;
    let lines;

    do {
        const font = `bold ${fontSize}px "Noto Sans Telugu", "Nirmala UI", Arial`;
        lines = wrapText(text, maxWidth, font);

        if (lines.length <= 3) break;

        fontSize -= 2;
    } while (fontSize >= minFontSize);

    ctx.fillStyle = "#101820";
    ctx.font = `bold ${fontSize}px "Noto Sans Telugu", "Nirmala UI", Arial`;

    const lineHeight = fontSize * 1.35;
    let y = 860;

    for (const line of lines) {
        ctx.fillText(line, left, y);
        y += lineHeight;
    }

    return y + 27;
}

function drawDescription(startY) {
    const text = $("description").value.trim();

    const left = 65;
    const maxWidth = 950;

    const fontSize = 40;
    const lineHeight = 64;

    const font = `${fontSize}px "Noto Sans Telugu", "Nirm
    ala UI", Arial`;

    const lines = wrapText(text, maxWidth, font);

    ctx.font = font;
    ctx.fillStyle = "#535b65";

    let y = startY;

    // Leave room for the footer
    const maxY = 1635;

    for (const line of lines) {
        if (y > maxY) {
            ctx.fillStyle = "#d71927";
            ctx.font = "bold 25px Arial";
            ctx.fillText("...", left, y);
            break;
        }

        ctx.fillStyle = "#535b65";
        ctx.font = font;
        ctx.fillText(line, left, y);

        y += lineHeight;
    }

    return y;
}

function drawFooter() {
    const stripeY = 1680;
    const stripeHeight = 6;

    const colors = [
        "#d71927",
        "#f4c542",
        "#2375b9",
        "#2b9a59"
    ];

    const segmentWidth = W / 4;

    colors.forEach((color, index) => {
        ctx.fillStyle = color;
        ctx.fillRect(
            index * segmentWidth,
            stripeY,
            segmentWidth,
            stripeHeight
        );
    });

    // Date and edition
    ctx.fillStyle = "#596474";
    ctx.font = "bold 27px Arial";
    ctx.textBaseline = "alphabetic";

    ctx.fillText(
        $("dateText").value.trim(),
        65,
        1730
    );

    // Large rounded share bar
    const barX = 55;
    const barY = 1760;
    const barW = 970;
    const barH = 75;
    const radius = 16;

    ctx.fillStyle = "#f1f3f4";

    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, radius);
    ctx.fill();

    // Left share text
    ctx.fillStyle = "#29364a";
    ctx.font = "bold 23px Arial";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "SHARE YOUR NEWS - 8500781269",
        75,
        barY + barH / 2
    );

    // Instagram icon
    const iconX = 725;
    const iconY = barY + 22;
    const iconSize = 31;

    ctx.save();

    ctx.strokeStyle = "#c13555";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.roundRect(iconX, iconY, iconSize, iconSize, 8);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(
        iconX + iconSize / 2,
        iconY + iconSize / 2,
        7,
        0,
        Math.PI * 2
    );
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(iconX + 23, iconY + 7, 2, 0, Math.PI * 2);
    ctx.fillStyle = "#c13555";
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = "#b52e4b";
    ctx.font = "bold 23px Arial";

    ctx.fillText(
        "@thegaruda_news",
        770,
        barY + barH / 2
    );
}

function renderPoster() {
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);

    drawPhotoSection();

    const nextY = drawHeadline();
    drawDescription(nextY);

    drawFooter();
}

function updateWordCount() {
    const words = getWords($("description").value);

    $("wordCount").textContent =
        words.length + " / 100 words";

    $("wordCount").style.color =
        words.length > 100 ? "#d71927" : "#7d8797";
}

["headline", "description", "dateText"].forEach(id => {
    $(id).addEventListener("input", () => {
        if (id === "description") updateWordCount();
        renderPoster();
    });
});

$("resetAll").addEventListener("click", () => {
    $("headline").value = "";
    $("description").value = "";
    renderPoster();
    updateWordCount();
});

$("refresh").addEventListener("click", renderPoster);

$("downloadBtn").addEventListener("click", () => {
    renderPoster();

    canvas.toBlob(blob => {
        if (!blob) {
            alert("Unable to create poster. Please try again.");
            return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = "THE-GARUDA-NEWS.png";
        a.click();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/png");
});

$("shareBtn").addEventListener("click", async () => {
    renderPoster();

    canvas.toBlob(async blob => {
        if (!blob) return;

        const file = new File(
            [blob],
            "THE-GARUDA-NEWS.png",
            { type: "image/png" }
        );

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({
                    title: "THE GARUDA NEWS",
                    text: "Your News. Your Voice.",
                    files: [file]
                });
            } catch (error) {
                if (error.name !== "AbortError") {
                    alert("Sharing was not completed. Please download the PNG.");
                }
            }
        } else {
            alert("Direct image sharing is not supported here. Please use Download PNG.");
        }
    }, "image/png");
});

// Initial rendering
updateWordCount();
renderPoster();

</script>

</body>
</html>
